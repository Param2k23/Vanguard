name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      VANGUARD_EMAIL: applicant@example.test
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended poppler-utils
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -v
        working-directory: job-scraper
        env:
          RUN_BROWSER_TESTS: '1'
      - run: python -m unittest discover -s job-agent/tests -v
